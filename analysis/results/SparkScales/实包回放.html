<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>整体倍率 · 实包检查</title>
<style>body{margin:24px;background:#111820;color:#e9eeed;font:16px system-ui}header{display:flex;gap:12px;align-items:center}button,select,input{font:inherit}canvas{display:block;width:640px;height:640px;max-width:90vw;background:#000;margin:18px 0}p{max-width:900px;line-height:1.7}a{color:#50dec5}</style>
<header><b>4.9.105 · 整体倍率实包检查</b><select id="kind"><option>PC</option><option>手机</option></select><button id="play">暂停</button><select id="rate"><option value="1">原速</option><option value=".25">¼速</option></select></header>
<canvas id="c" width="640" height="640"></canvas><input id="tick" type="range" min="0" max="63" value="0" style="width:640px;max-width:90vw"><span id="label"></span>
<p>内部验证副本：半锥角×0.8、数量×1.2、直径×1.1、寿命×1.1、亮度×0.9。实际素材包的64帧按30 fps回放；不覆盖你的存档或推荐候选。</p>
<p><a href="../../../tool/FireworkBaker.html">打开烘焙器</a> · <a href="倍率样例.zip">内部验证素材包</a></p><p>本机浏览器检查通过不代表UE实测或用户认可。</p>
<script>const data={"PC": {"file": "PC-序列.png", "cell": 512, "frames": 64, "life": 2.1333, "aspect": 0.7}, "手机": {"file": "手机-序列.png", "cell": 256, "frames": 64, "life": 2.1333, "aspect": 0.7}};let running=true,t=0,last=performance.now(),img=new Image;const c=document.getElementById('c'),ctx=c.getContext('2d'),kind=document.getElementById('kind'),rate=document.getElementById('rate'),tick=document.getElementById('tick'),label=document.getElementById('label');function load(){img.src=data[kind.value].file;t=0}kind.onchange=load;load();document.getElementById('play').onclick=e=>{running=!running;e.target.textContent=running?'暂停':'播放'};tick.oninput=()=>{t=+tick.value/30;running=false;document.getElementById('play').textContent='播放'};function draw(now){const d=data[kind.value];if(running)t=(t+(now-last)/1000*(+rate.value))%d.life;last=now;const f=Math.min(63,Math.floor(t*30+1e-6)),h=640/Math.max(1,d.aspect),w=h*d.aspect;ctx.fillStyle='#000';ctx.fillRect(0,0,640,640);if(img.complete&&img.naturalWidth)ctx.drawImage(img,f%8*d.cell,Math.floor(f/8)*d.cell,d.cell,d.cell,(640-w)/2,(640-h)/2,w,h);tick.value=f;label.textContent=` 第${f+1}/64帧 · ${(f/30).toFixed(2)}s`;requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></html>
