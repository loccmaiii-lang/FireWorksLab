<div class="kit-bar" id="sampleBar" role="toolbar" aria-label="样板控制条">
  <button class="kit-tog" id="kitTog" type="button" aria-expanded="false" aria-controls="sampleBar">样板控制<svg class="i"><use href="#i-cd"/></svg></button>
  <span class="kn">E 样板 v2.3</span>
  <div class="kg">视图<div class="seg" data-kit="view"><button data-v="main" aria-pressed="true">主屏</button><button data-v="sheet" aria-pressed="false">组件全表</button></div></div>
  <div class="kg">主屏场景<div class="seg" data-kit="scene"><button data-v="kiku" aria-pressed="true">金曜菊-B</button><button data-v="spk" aria-pressed="false">仙女棒</button></div></div>
  <div class="kg">屏幕<div class="seg" data-kit="size"><button data-v="1920" aria-pressed="true">1920 × 1080</button><button data-v="1366" aria-pressed="false">1366 × 768</button></div></div>
  <div class="kg">边界<div class="seg" data-kit="bound"><button data-v="v2" aria-pressed="false">v2</button><button data-v="tone" aria-pressed="false">底色</button><button data-v="frame" aria-pressed="true">分隔</button></div></div>
  <div class="kg">模块<div class="seg" data-kit="mod"><button data-v="band" aria-pressed="true">底色条</button><button data-v="rule" aria-pressed="false">分隔线</button></div></div>

  <span id="sbarShell"></span>

<div class="kit-main" id="kitMain">
<div class="app" id="app">
  <header id="shell" class="shell"></header>
  <div class="ws" id="wsBaker">
  <!-- 制作区工具行：只在中栏、右栏上方（左栏从外壳顶栏下直接开始）。中「工作模式 + 视图控件」（对齐画面左边），右「撤销组、保存组、需重新导出 + 导出 ▾」 -->
  <div class="topbar cols" id="toolRow" role="toolbar" aria-label="制作区工具">
    <div class="tcol tcol-m">
      <div class="modeseg" id="modeTabs" role="group" aria-label="工作模式"><button data-v="实时模拟" aria-pressed="false" data-tip="按参数实时计算，不出贴图">实时模拟</button><button data-v="引擎回放" aria-pressed="true" data-tip="按引擎方式播放导出贴图">引擎回放</button><button data-v="贴图与交付" aria-pressed="false" data-tip="核对贴图与各平台产物">贴图与交付</button></div>
      <div class="vctl" id="viewbar"></div>
    </div>
    <div class="tcol tcol-r">
      <div class="tgrp" role="group" aria-label="撤销与版本">
      <button class="btn btn-icon" id="bUndo" data-act="undo" data-tip="撤销" data-key="Ctrl+Z" aria-label="撤销"><svg class="i"><use href="#i-undo"/></svg></button>
      <button class="btn btn-icon" id="bRedo" data-act="redo" data-tip="重做" data-key="Ctrl+Y" aria-label="重做"><svg class="i"><use href="#i-redo"/></svg></button>
      <button class="btn btn-text tbtn" id="bRevert" data-act="revert" data-tip="回到上次保存">还原</button>
      <button class="btn btn-icon" data-act="versions" data-tip="版本记录" aria-label="版本记录" aria-haspopup="menu"><svg class="i"><use href="#i-history"/></svg></button>
      </div>
      <div class="tgrp" role="group" aria-label="保存">
      <button class="btn btn-2" data-act="save" data-tip="保存" data-key="Ctrl+S">保存</button>
      <button class="btn btn-text tbtn" data-act="saveAs" data-tip="存成新效果">另存</button>
      </div>
      <span class="sp"></span>
      <button class="exp-st" id="expSt" type="button" data-act="expStMenu"></button>
      <div class="split" id="expBtn"></div>
    </div>
  </div>
  <div class="body">
    <aside class="left" id="left">
      <section class="pane tree-pane" id="treePane" aria-label="结构">
        <div class="tree" id="tree" role="tree" aria-label="结构树"></div>
        <div class="tree-foot"><button class="btn btn-text tbtn sm" data-act="addLayer" aria-haspopup="menu"><svg class="i"><use href="#i-plus"/></svg>加层<svg class="i dd"><use href="#i-cd"/></svg></button><button class="btn btn-text tbtn sm" data-act="addEmit"><svg class="i"><use href="#i-plus"/></svg>加发射器</button><span class="sp"></span>
          <label class="field search sm" id="treeQ" hidden><svg class="i"><use href="#i-filter"/></svg><input type="search" placeholder="筛选" aria-label="筛选结构树"><button class="clr" type="button" aria-label="清除筛选"><svg class="i"><use href="#i-x"/></svg></button></label><span id="effName" hidden></span></div>
      </section>
      <div class="splitter" id="splitter" role="separator" aria-orientation="horizontal" aria-label="调整结构与效果库高度" tabindex="0" data-tip="拖动调整高度，双击复位"></div>
      <section class="pane lib-pane" id="libPane" aria-label="效果库">
        <div class="lib-head"><button class="pane-t" id="libToggle" aria-expanded="true" aria-label="收起效果库" data-tip="收起效果库"><svg class="i"><use href="#i-cr"/></svg></button>
          <div class="tabs tabs-lg" role="tablist" id="libTabs" aria-label="效果库"><button class="tab" role="tab" data-t="效果" data-v="效果" aria-selected="true">效果</button><button class="tab" role="tab" data-t="模板" data-v="模板" aria-selected="false">模板</button></div></div>
        <div class="lib-body">
          <div class="tabs tabs-sub" role="tablist" id="libSub" hidden><button class="tab" role="tab" data-t="花型" data-v="花型模板" aria-selected="true">花型</button><button class="tab" role="tab" data-t="多层花型" data-v="多层花型模板" aria-selected="false">多层花型</button><button class="tab" role="tab" data-t="我的" data-v="我的模板" aria-selected="false">我的</button></div>
          <div class="lib-tools">
            <label class="field search" id="libQ"><svg class="i"><use href="#i-search"/></svg><input type="search" placeholder="名称、任务号、花型" aria-label="搜索效果库"><button class="clr" type="button" aria-label="清除搜索"><svg class="i"><use href="#i-x"/></svg></button></label>
            <div class="lib-meta"><div class="seg sm" id="libChips" role="group" aria-label="花型筛选"><button data-v="全部" aria-pressed="true">全部</button><button data-v="球花" aria-pressed="false">球花</button><button data-v="尾缀" aria-pressed="false">尾缀</button><button data-v="扇形" aria-pressed="false">扇形</button></div><span class="sp"></span><span class="cnt" id="libCount"></span><button class="btn btn-text sm" data-act="libNew" data-tip="新建效果" aria-label="新建"><svg class="i"><use href="#i-plus"/></svg><span class="t">新建</span></button></div>
          </div>
          <div class="lib-list" id="libList" role="listbox" aria-label="效果列表"></div>
        </div>
      </section>
    </aside>

    <main class="mid" id="mid">
      <div class="stage" id="stage">
        <div class="vp" id="vp">
          <div class="cell" id="cell"><img id="imA" alt=""><img id="imB" alt=""><i class="cm a"></i><i class="cm b"></i><i class="cm c"></i><i class="cm d"></i><div class="cgrid" id="cgrid" hidden><i style="left:33.33%;top:0;bottom:0;width:1px"></i><i style="left:66.67%;top:0;bottom:0;width:1px"></i><i style="top:33.33%;left:0;right:0;height:1px"></i><i style="top:66.67%;left:0;right:0;height:1px"></i></div>
            <span class="ci c-tl" id="ciTL"></span><div class="ci c-bl"><span class="ci-i" id="ciBL"></span></div><div class="ci c-br"><span class="ci-v" id="ciView"></span></div></div>
        </div>
        <button class="solo-badge" id="soloBadge" hidden data-act="soloExit"></button>
        <div class="deliv" id="deliv" hidden></div>
      </div>
      <div class="vsplit" id="vsplit" role="separator" aria-orientation="horizontal" aria-label="调整画面与时间轴的高度" tabindex="0" data-tip="拖动调整时间轴高度，双击复位"></div>
      <div class="transport" id="transport"></div>
      <div class="tlw" id="tlw"></div>
    </main>

    <aside class="insp" id="insp" aria-label="参数">
      <div class="insp-h"><nav class="path" id="path" aria-label="当前对象路径"></nav><span class="tier" id="tier" hidden></span></div>
      <div class="insp-note" id="hidNote" hidden></div>
      <div class="insp-tools">
        <label class="field search" id="pq"><svg class="i"><use href="#i-search"/></svg><input type="search" placeholder="参数名" aria-label="搜索参数"><button class="clr" type="button" aria-label="清除搜索"><svg class="i"><use href="#i-x"/></svg></button></label>
        <button class="btn btn-text tbtn" id="foldAll" data-act="foldAll">全部折叠</button>
        <button class="btn btn-text tbtn" id="viewOpt" data-act="viewOpt" aria-haspopup="menu">筛选<svg class="i dd"><use href="#i-cd"/></svg></button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </div>
  <footer class="status" id="status">
    <div class="st-l"><button class="btn btn-text tbtn sm" data-act="copyNotes">复制意见</button></div>
    <div class="st-r"><button class="btn btn-text tbtn sm" id="saveSt" data-act="changes" aria-haspopup="menu"></button><span id="sbPreview"></span><button class="btn btn-text tbtn sm" data-act="keys">快捷键<kbd>?</kbd></button></div>
  </footer>
  </div>
  <div class="ovl" id="ovlApp"></div>
</div>
</div>

<div class="kit-sheet" id="kitSheet" hidden><div id="sheetBody"></div><section id="sheetShell"></section><div class="ovl" id="ovlSheet" style="position:fixed"></div></div>
