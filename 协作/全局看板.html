<title>FireWorksLab 全局看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Material 3 structure with a priority layer — sticky app bar (deadline chip, tabs with red badges when something blocks), then a red-tinted 先处理 panel listing only the rows that hold others up, then the tab's grouped list (周三前 amber stripe, 周四以后 plain, 暂不建议 folded, finished folded). Rows expand in place for details, answers and feedback; the side sheet is only for editing/adding a row.
   Colour roles: red = blocking / deadline, amber = due before Wednesday or waiting, teal = only what you can press, grey = later. Palette = tool/design-system v0.1.1 (DF dark) + derived light; shape S (4 / 6 / 8). */
:root{
  --surface:#f4f8f8; --surface-low:#ffffff; --surface-container:#eaf1f2; --surface-high:#dde8ea;
  --on-surface:#13252a; --on-surface-muted:#4a6067;
  --primary:#00785e; --on-primary:#ffffff; --primary-container:#c6eee0; --on-primary-container:#00382b;
  --outline:#6c848c; --divider:#d3dfe2;
  --error:#b3261e; --error-container:#fbe1de; --warning:#7a5200; --warning-container:#fbefd6;
  --success:#1b6b4d; --success-container:#d6f2e6; --focus:#00785e;
  --inverse-surface:#22353b; --inverse-on-surface:#e4edef; --inverse-primary:#00d49b;
  --scrim:rgba(8,18,21,.42); --shadow:0 8px 28px rgba(8,18,21,.18), 0 2px 6px rgba(8,18,21,.10);
  --r-control:4px; --r-panel:6px; --r-dialog:8px;
  --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --surface:#111d21; --surface-low:#121f24; --surface-container:#1b2a2f; --surface-high:#24373d;
  --on-surface:#e4edef; --on-surface-muted:#b4c5cb;
  --primary:#00d49b; --on-primary:#062a23; --primary-container:#173d39; --on-primary-container:#a1ded0;
  --outline:#8da3ac; --divider:#2b4149;
  --error:#e7735a; --error-container:#3f2525; --warning:#e4bb7c; --warning-container:#40321e;
  --success:#81d8b6; --success-container:#173d39; --focus:#36e4b0;
  --inverse-surface:#e4edef; --inverse-on-surface:#13252a; --inverse-primary:#00785e;
  --scrim:rgba(0,0,0,.55); --shadow:0 8px 28px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --surface:#111d21; --surface-low:#121f24; --surface-container:#1b2a2f; --surface-high:#24373d;
  --on-surface:#e4edef; --on-surface-muted:#b4c5cb;
  --primary:#00d49b; --on-primary:#062a23; --primary-container:#173d39; --on-primary-container:#a1ded0;
  --outline:#8da3ac; --divider:#2b4149;
  --error:#e7735a; --error-container:#3f2525; --warning:#e4bb7c; --warning-container:#40321e;
  --success:#81d8b6; --success-container:#173d39; --focus:#36e4b0;
  --inverse-surface:#e4edef; --inverse-on-surface:#13252a; --inverse-primary:#00785e;
  --scrim:rgba(0,0,0,.55); --shadow:0 8px 28px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--surface);color:var(--on-surface);font-family:var(--font);font-size:14px;line-height:22px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:0}
.muted{color:var(--on-surface-muted)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--divider)}
.appbar-in,.page{max-width:1240px;margin:0 auto;padding-inline:16px}
.appbar-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 8px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand small{font-size:12px;line-height:18px;color:var(--on-surface-muted)}
.brand h1{margin:0;font-size:22px;line-height:30px;font-weight:700}
.deadline{display:inline-flex;align-items:center;gap:6px;height:32px;padding-inline:10px;border-radius:var(--r-control);background:var(--warning-container);color:var(--warning);font-size:13px;font-weight:600;white-space:nowrap}
.deadline.late{background:var(--error-container);color:var(--error)}
.search{display:flex;align-items:center;gap:8px;height:40px;padding-inline:12px;border-radius:var(--r-control);background:var(--surface-container);min-width:0;flex:0 1 240px}
.search input{border:0;background:transparent;outline:0;min-width:0;width:100%;font-size:14px}
.search:focus-within{outline:2px solid var(--focus)}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border:0;border-radius:var(--r-control);background:transparent;color:var(--on-surface-muted);cursor:pointer;flex:none}
.icon-btn:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent);color:var(--on-surface)}
.icon-btn[aria-expanded="true"]{color:var(--primary)}

/* tabs */
.tabs{display:flex;overflow-x:auto;scrollbar-width:thin}
.tab{position:relative;display:inline-flex;align-items:center;gap:8px;height:48px;padding-inline:16px;border:0;background:transparent;color:var(--on-surface-muted);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab:hover{background:color-mix(in srgb,var(--on-surface) 6%,transparent);color:var(--on-surface)}
.tab[aria-selected="true"]{color:var(--primary);font-weight:600}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
.badge{min-width:20px;height:18px;padding-inline:6px;border-radius:9px;background:var(--surface-high);color:var(--on-surface);font-size:11px;line-height:18px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.badge.hot{background:var(--error);color:var(--surface-low)}

.page{display:flex;flex-direction:column;gap:20px;padding-block:20px 96px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-panel);background:var(--warning-container)}
.banner svg{color:var(--warning);margin-top:1px}
.banner a{color:var(--primary)}

/* priority 1: focus panel */
.focus{border:1px solid color-mix(in srgb,var(--error) 45%,var(--divider));border-radius:var(--r-panel);background:color-mix(in srgb,var(--error-container) 55%,var(--surface-low));overflow:hidden}
.focus-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;padding:14px 16px 12px}
.focus-head .t{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.eyebrow{font-size:12px;line-height:18px;font-weight:700;letter-spacing:.08em;color:var(--error)}
.focus-head h2{margin:0;font-size:18px;line-height:26px;font-weight:700;text-wrap:balance}
.focus-head p{margin:0;font-size:13px;line-height:20px;color:var(--on-surface-muted)}
.focus .list{border:0;border-top:1px solid color-mix(in srgb,var(--error) 30%,var(--divider));border-radius:0}
.focus-empty{padding:4px 16px 16px;color:var(--success);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 16px 12px;font-size:12px;line-height:18px;color:var(--on-surface-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.sw-hot{background:var(--error)} .sw-wait{background:var(--warning)} .sw-act{background:var(--primary)} .sw-later{background:var(--outline)}

.hint{margin:0;font-size:13px;line-height:20px;color:var(--on-surface-muted);max-width:90ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding-inline:12px;border:1px solid var(--outline);border-radius:var(--r-control);background:transparent;cursor:pointer;font-size:13px}
.chip:hover{background:color-mix(in srgb,var(--on-surface) 6%,transparent)}
.chip[aria-pressed="true"]{background:var(--primary-container);color:var(--on-primary-container);border-color:transparent;padding-left:8px}
.chip[aria-pressed="true"] svg{width:16px;height:16px}

/* groups and rows */
.group{display:flex;flex-direction:column;gap:8px}
.subhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:0;font-size:15px;line-height:22px;font-weight:700}
.subhead .muted{font-size:12px;font-weight:400}
.subhead.soon{color:var(--error)}
.subhead.later{color:var(--on-surface-muted)}
.list{list-style:none;margin:0;padding:0;background:var(--surface-low);border:1px solid var(--divider);border-radius:var(--r-panel);overflow:hidden}
.item{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:start;gap:0 8px;padding:8px 12px 8px 6px;border-top:1px solid var(--divider)}
.item:first-child{border-top:0}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.item.u-hot::before{background:var(--error)}
.item.u-soon::before{background:var(--warning)}
.item:hover{background:color-mix(in srgb,var(--on-surface) 3%,transparent)}
.item.is-open{background:color-mix(in srgb,var(--primary) 4%,var(--surface-low))}
.lead{display:grid;place-items:center;width:48px;min-height:48px}
.body{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;min-width:0;padding:6px 0;border:0;background:transparent;cursor:pointer}
.over{font-size:12px;line-height:18px;color:var(--on-surface-muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.head{font-size:15px;line-height:23px;font-weight:600;text-wrap:pretty}
.u-hot .head,.u-soon .head{font-weight:700}
.u-later .head{color:var(--on-surface-muted)}
.sup{font-size:14px;line-height:22px;color:var(--on-surface);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:92ch}
.u-later .sup,.closed .sup{color:var(--on-surface-muted)}
.sup b,.sec b,.strip b{font-weight:700}
.lab{font-size:12px;line-height:18px;font-weight:700;letter-spacing:.04em;color:var(--primary);margin-right:6px}
.sup .lab{font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:1px 8px;border-radius:var(--r-control);font-size:12px;line-height:18px;font-weight:600}
.tag svg{width:14px;height:14px}
.t-hot{background:var(--error);color:var(--surface-low)}
.t-hot-soft{background:var(--error-container);color:var(--error)}
.t-wait{background:var(--warning-container);color:var(--warning)}
.t-ok{background:var(--success-container);color:var(--success)}
.t-info{background:transparent;color:var(--on-surface-muted);border:1px solid var(--divider);font-weight:500}
.t-neutral{background:var(--surface-high);color:var(--on-surface);font-weight:500}
.note{display:flex;gap:6px;margin-top:4px;font-size:13px;line-height:20px}
.note svg{width:16px;height:16px;margin-top:2px;color:var(--primary)}
.note.reply svg{color:var(--success)}
.trail{display:flex;align-items:center;gap:4px;padding-top:8px}
.item.closed .head{color:var(--on-surface-muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--on-surface-muted) 60%,transparent);font-weight:500}

/* in-place details */
.more{grid-column:2 / -1;display:flex;flex-direction:column;gap:14px;padding:6px 4px 10px 0}
/* expanded card reading order: ① status strip ② 推荐 ③ 要注意 ④ 说明 ⑤ act ⑥ small meta */
.sec{display:flex;flex-direction:column;gap:4px;max-width:92ch}
.sec p{margin:0;white-space:pre-wrap}
.sec ul{margin:0;padding-left:18px}
.sec .lab{display:inline-flex;align-items:center;gap:4px}
.sec .lab svg{width:14px;height:14px}
.key{padding:10px 14px;border-left:3px solid var(--primary);border-radius:0 var(--r-panel) var(--r-panel) 0;background:var(--surface-container)}
.key p{font-size:16px;line-height:26px;color:var(--on-surface)}
.warn{padding:8px 14px;border-left:3px solid var(--warning);border-radius:0 var(--r-panel) var(--r-panel) 0;background:var(--warning-container)}
.warn .lab{color:var(--warning)}
.warn ul{font-size:14px;line-height:22px}
.desc p{font-size:14px;line-height:22px}
.desc .lab{color:var(--on-surface-muted)}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:0;padding-top:8px;border-top:1px dashed var(--divider);font-size:12px;line-height:18px;color:var(--on-surface-muted)}
.meta dt{white-space:nowrap}
.meta dd{margin:0;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.strip{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r-panel);font-size:14px;line-height:22px}
.strip svg{width:18px;height:18px;margin-top:2px}
.strip > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.strip span{color:var(--on-surface)}
.s-wait{background:var(--warning-container)} .s-wait svg,.s-wait b{color:var(--warning)}
.s-next{background:var(--primary-container)} .s-next svg,.s-next b{color:var(--on-primary-container)}
.s-ok{background:var(--success-container)} .s-ok svg,.s-ok b{color:var(--success)}
.t-next{background:var(--primary-container);color:var(--on-primary-container)}
.note.next svg{color:var(--on-primary-container)}
.daily{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:0 16px 12px;padding:8px 12px;border-radius:var(--r-panel);background:var(--surface-low);font-size:13px;line-height:20px}
.daily b{font-weight:700}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:13px;line-height:20px}
.kv dt,.kv .dt{color:var(--on-surface-muted);white-space:nowrap}
.kv dd,.kv .dd{margin:0;white-space:pre-wrap;min-width:0}
.fieldset{display:flex;flex-direction:column;gap:6px}
.fieldset>label{font-size:12px;line-height:18px;font-weight:700;color:var(--on-surface-muted)}
.field{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--outline);border-radius:var(--r-control);background:var(--surface-low);font-size:14px;line-height:22px}
.field:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}
textarea.field{min-height:64px;resize:vertical}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.save-state{font-size:12px;color:var(--on-surface-muted)}
.callout{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:var(--r-panel);background:var(--success-container);color:var(--on-surface);font-size:13px}

/* checkbox */
.cbx{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;cursor:pointer}
.cbx:hover{background:color-mix(in srgb,var(--primary) 10%,transparent)}
.cbx input{appearance:none;-webkit-appearance:none;margin:0;width:20px;height:20px;border:2px solid var(--primary);border-radius:3px;cursor:pointer;display:grid;place-items:center;background:var(--surface-low);transition:background .1s}
.cbx input:checked{background:var(--primary)}
.cbx input:checked::after{content:"";width:10px;height:5px;border-left:2px solid var(--on-primary);border-bottom:2px solid var(--on-primary);transform:translateY(-1px) rotate(-45deg)}
.cbx input:disabled{cursor:not-allowed;opacity:.45}
.cbx input:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.glyph{width:22px;height:22px}
.g-todo{color:var(--outline)} .g-doing{color:var(--warning)} .g-done{color:var(--success)} .g-drop{color:var(--outline)} .g-ask{color:var(--primary)}

/* buttons: teal is only for things you can press */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding-inline:14px;border:0;border-radius:var(--r-control);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn svg{width:18px;height:18px}
.filled{background:var(--primary);color:var(--on-primary)}
.filled:hover{background:color-mix(in srgb,var(--on-primary) 12%,var(--primary))}
.tonal{background:var(--primary-container);color:var(--on-primary-container)}
.tonal:hover{background:color-mix(in srgb,var(--on-primary-container) 12%,var(--primary-container))}
.text{background:transparent;color:var(--primary)}
.text:hover{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.outlined{background:transparent;color:var(--primary);border:1px solid var(--outline)}
.danger{background:transparent;color:var(--error);border:1px solid var(--error)}

details.fold{border:1px dashed var(--divider);border-radius:var(--r-panel)}
details.fold>summary{display:flex;align-items:center;gap:8px;min-height:44px;padding-inline:12px;cursor:pointer;color:var(--on-surface-muted);font-size:13px;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary svg{transition:transform .16s}
details.fold[open]>summary svg{transform:rotate(180deg)}
details.fold .list{border:0;border-top:1px dashed var(--divider);border-radius:0 0 var(--r-panel) var(--r-panel)}
.fold-note{font-size:12px;color:var(--on-surface-muted);margin:-2px 0 0}

/* resources table */
.table-wrap{overflow-x:auto;border:1px solid var(--divider);border-radius:var(--r-panel);background:var(--surface-low)}
table{border-collapse:collapse;width:100%;min-width:920px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--divider)}
th{font-size:12px;line-height:18px;font-weight:600;color:var(--on-surface-muted);background:var(--surface-container);white-space:nowrap}
tr.cat td{background:var(--surface-container);font-weight:700;font-size:13px;padding-block:6px}
tr.row{cursor:pointer}
tr.row:hover td{background:color-mix(in srgb,var(--on-surface) 3%,transparent)}
tr.row.wed td:first-child{box-shadow:inset 4px 0 0 var(--error)}
tr.row.is-open td{background:color-mix(in srgb,var(--primary) 4%,var(--surface-low))}
tr.exp td{background:color-mix(in srgb,var(--primary) 4%,var(--surface-low))}
td .name{font-weight:600}
td .small{font-size:12px;line-height:18px;color:var(--on-surface-muted)}
td.wrap{max-width:30ch;font-size:13px;line-height:20px}

/* dialogs / updates */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.card{display:flex;flex-direction:column;border:1px solid var(--divider);border-radius:var(--r-panel);background:var(--surface-low);min-width:0}
.card.waiting{border-color:color-mix(in srgb,var(--warning) 60%,var(--divider))}
.card-hd{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:0;background:transparent;text-align:left;cursor:pointer;width:100%}
.card h3{margin:0;font-size:15px;line-height:22px}
.card .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .kv{font-size:13px}
.card .more{padding:0 16px 14px}
.rep{padding:14px 16px;gap:6px}
.rep h4{margin:6px 0 2px;font-size:12px;line-height:18px;color:var(--on-surface-muted);font-weight:700}
.rep ul{margin:0;padding-left:18px;font-size:13px;line-height:20px}
.rep p{margin:0;font-size:13px;line-height:21px;max-width:88ch}
.updates{display:flex;flex-direction:column;gap:12px}
.empty{padding:40px 16px;text-align:center;color:var(--on-surface-muted);border:1px dashed var(--divider);border-radius:var(--r-panel)}

/* edit sheet (only for editing / adding rows) */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:21;display:flex;flex-direction:column;background:var(--surface-container);box-shadow:var(--shadow);border-radius:var(--r-dialog) 0 0 var(--r-dialog);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (max-width:599px){.sheet{border-radius:0}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:in .16s ease-out}@keyframes in{from{transform:translateX(32px);opacity:.4}to{transform:none;opacity:1}}}
.sheet-head{display:flex;align-items:flex-start;gap:8px;padding:16px 12px 12px 20px;border-bottom:1px solid var(--divider)}
.sheet-head h2{margin:0;flex:1;font-size:18px;line-height:26px;font-weight:700}
.sheet-body{flex:1;overflow-y:auto;padding:16px 20px 24px;display:grid;gap:12px}
.sheet-body label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--on-surface-muted)}
.sheet-body label>*{font-weight:400;color:var(--on-surface)}
.sheet-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--divider)}

  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>', reply:'<path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 6 6"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  todo:'<circle cx="12" cy="12" r="8.5"/>', doing:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/>',
  done:'<circle cx="12" cy="12" r="8.5"/><path d="M8 12.3l2.8 2.8L16.3 9.5"/>', drop:'<circle cx="12" cy="12" r="8.5"/><path d="M6.2 17.8L17.8 6.2"/>',
  ask:'<circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6M12 16.8v.2"/>', block:'<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 16.8v.2"/>', hour:'<path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9"/>'
};
const ic = (n, cls) => `<svg class="i${cls ? " " + cls : ""}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);
const isOpen = r => OPEN.has(r.status || "没做");
const isHot = r => MINE.has(r.kind) && String(r.pri) === "1" && r.when === "周三前必须";
const newFb = r => !!(r.feedback && r.feedback.trim() && r.feedback !== r.feedbackSeen);
const waitingSync = r => MINE.has(r.kind) && r.status === "已做" && r.doneAt && !r.syncedAt;
/* 你处理过的行走三步：wait 已反馈 · 等总管 → next 已转出 · 待下一步（总管写 next）→ nextdone 下一步做完（总管写 nextDoneAt） */
function stage(r){
  if (!r.kind) return newFb(r) ? "wait" : "";   // 资源 / 对话框：只有「已反馈 · 等总管」一步（资源的 next 是「下一步 · 谁」列，另一回事）
  const acted = MINE.has(r.kind) && r.status === "已做" && r.doneAt;
  if ((acted && !r.syncedAt) || newFb(r)) return "wait";
  const handled = (acted && r.syncedAt) || ((r.feedback || "").trim() && r.feedback === r.feedbackSeen);
  if (handled && (r.next || "").trim()) return r.nextDoneAt ? "nextdone" : "next";
  return "";
}
const fmt = t => { const d = new Date(t); if (isNaN(d)) return ""; const p = n => String(n).padStart(2, "0"); return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
/* 正文加粗：**…** 显式加粗；auto = 没写 ** 时把第一句（≤ 60 字，到 。；！？ 为止）加粗——推荐的第一句就是结论 */
function rich(t, auto){
  let h = esc(t);
  if (h.includes("**")) return h.replace(/\*\*([^*]+?)\*\*/g, "<b>$1</b>");
  if (auto){
    const m = h.match(/^(.{2,60}?[。；！？;])/) || h.match(/^(.{2,30}?[，,：:])/);
    if (m && m[1].length < h.length) return `<b>${m[1]}</b>` + h.slice(m[1].length);
  }
  return h;
}

const state = { tab:"todo", area:"", q:"", rows:{items:[],resources:[],dialogs:[],reports:[]}, loaded:{}, db:null, canWrite:false, offline:false,
  open:new Set(), drafts:{}, pending:false, sheet:null, focusOpen:true };
try {
  const h = location.hash.replace("#",""); if (TABS.some(t => t.id === h)) state.tab = h; else { const s = localStorage.getItem("fwb.tab"); if (TABS.some(t => t.id === s)) state.tab = s; }
  if (localStorage.getItem("fwb.focus") === "0") state.focusOpen = false;
} catch (e) {}
const tabDef = () => TABS.find(t => t.id === state.tab);
const rowById = (coll, id) => state.rows[coll].find(r => r._id === id);
const hoursLeft = () => Math.max(0, Math.floor((DEADLINE - Date.now()) / 3600000));

function marks(){
  const m = {}, cut = Date.now() - 48 * 3600 * 1000;
  for (const r of [...state.rows.reports].sort((a,b) => String(a.at).localeCompare(String(b.at)))){
    if (!(Date.parse(r.at) >= cut)) continue;
    for (const id of r.changed || []) m[id] = "改";
    for (const id of r.added || []) m[id] = "新";
  }
  return m;
}
const itemsOf = kind => state.rows.items.filter(r => r.kind === kind);
const wedOpen = kind => itemsOf(kind).filter(r => r.when === "周三前必须" && isOpen(r)).length;
const hotOpen = kind => itemsOf(kind).filter(r => isHot(r) && isOpen(r)).length;
function urgency(r){
  if (!isOpen(r)) return "";
  if (isHot(r)) return "u-hot";
  if (r.when === "周三前必须") return "u-soon";
  if (r.when === "暂不建议") return "u-later";
  return "";
}

    <div class="legend" aria-label="颜色说明"><span><i class="sw-hot"></i>红：卡着别人 / 截止</span><span><i class="sw-wait"></i>琥珀：周三前 / 在等</span><span><i class="sw-act"></i>青绿：你能点的</span><span><i class="sw-later"></i>灰：以后再说</span></div>

function renderChips(){
  const t = tabDef(), el = $("#chips");

  el.hidden = false;
  el.innerHTML = ["", ...AREAS].map(a => `<button class="chip" type="button" data-area="${esc(a)}" aria-pressed="${state.area === a}">${state.area === a ? ic("check") : ""}${esc(a || "全部")}</button>`).join("");

function match(r){
  if (state.area && tabDef().coll === "items" && r.area !== state.area) return false;
  if (state.q && !Object.values(r).join(" ").toLowerCase().includes(state.q)) return false;
  return true;
}

/* ---------- item rows ---------- */
function draft(kind, coll, r, field){ const k = kind + ":" + coll + ":" + r._id; return k in state.drafts ? state.drafts[k] : (r[field] || ""); }
function syncTag(r){
  const g = stage(r);
  if (g === "wait") return `<span class="tag t-wait">${ic("clock")}已反馈 · 等总管</span>`;
  if (g === "next") return `<span class="tag t-next">${ic("reply")}${r.syncedTo ? "已转 " + esc(r.syncedTo) : "总管已回"} · 待下一步</span>`;
  if (g === "nextdone") return `<span class="tag t-ok">${ic("check")}下一步已做完</span>`;
  if (MINE.has(r.kind) && r.status === "已做" && r.doneAt && r.syncedAt) return `<span class="tag t-ok">${ic("check")}已同步 → ${esc(r.syncedTo || "")}</span>`;
  return "";
}
function stripHTML(r){
  const g = stage(r);
  const what = r.kind === "你要定" && r.status === "已做" ? "定了" : r.kind === "你要做" && r.status === "已做" ? "勾了做好" : "写了反馈";
  const when = fmt(r.doneAt && r.status === "已做" ? r.doneAt : r.feedbackAt);
  if (g === "wait") return `<div class="strip s-wait">${ic("clock")}<div><b>已反馈 · 等总管处理</b><span>你${when ? " " + when : ""} ${what}。总管下次上线，或夜班（每晚 23:47 / 02:47 / 05:47）会转给负责的对话框，并在这里写下一步。</span></div></div>`;
  if (g === "next") return `<div class="strip s-next">${ic("reply")}<div><b>${r.syncedTo ? "已转给 " + esc(r.syncedTo) : "总管已处理"} · 待下一步</b><span>下一步：${rich(r.next)}</span></div></div>`;
  if (g === "nextdone") return `<div class="strip s-ok">${ic("done")}<div><b>下一步已做完${r.nextDoneAt ? " · " + esc(fmt(r.nextDoneAt) || r.nextDoneAt) : ""}</b><span>${rich(r.next)}</span></div></div>`;
  return "";
}
function leadHTML(r){
  if (r.kind === "你要做"){
    const dis = state.canWrite ? "" : " disabled";
    return `<label class="cbx" title="${r.status === "已做" ? "取消「做好了」" : "我做好了"}"><input type="checkbox" data-done="${esc(r._id)}"${r.status === "已做" ? " checked" : ""}${dis} aria-label="我做好了：${esc(r.title)}"></label>`;
  }
  if (r.kind === "你要定"){
    const k = r.status === "已做" ? "done" : r.status === "不做了" ? "drop" : "ask";
    return `<span role="img" aria-label="${k === "done" ? "已定" : k === "drop" ? "不做了" : "待定"}">${ic(k, "glyph g-" + k)}</span>`;
  }
  const s = r.status || "没做", k = {"没做":"todo","在做":"doing","已做":"done","不做了":"drop"}[s] || "todo";
  return `<span role="img" aria-label="${esc(s)}" title="${esc(s)}">${ic(k, "glyph g-" + k)}</span>`;
}
function moreHTML(r, where){
  const ro = !state.canWrite, id = esc(r._id), uid = where + "-" + id;
  let h = stripHTML(r);
  if ((r.recommend || "").trim()) h += `<section class="sec key"><span class="lab">${r.kind === "你要定" ? "推荐" : "怎么做"}</span><p>${rich(r.recommend, true)}</p></section>`;
  const w = [];
  if (isOpen(r) && r.blocks) w.push(`${isHot(r) ? "卡着" : "影响"}：<b>${esc(r.blocks)}</b>`);
  if (isOpen(r) && r.waitsOn) w.push(`在等：<b>${esc(r.waitsOn)}</b>`);
  if ((r.warn || "").trim()) w.push(rich(r.warn));
  if (w.length) h += `<section class="sec warn"><span class="lab">${ic("block")}要注意</span><ul>${w.map(x => `<li>${x}</li>`).join("")}</ul></section>`;
  if ((r.detail || "").trim()) h += `<section class="sec desc"><span class="lab">说明</span><p>${rich(r.detail)}</p></section>`;
  if (r.kind !== "你要定" && (r.answer || "").trim()) h += `<section class="sec desc"><span class="lab">你的答复</span><p>${rich(r.answer)}</p></section>`;

    if (r.status === "已做") h += `<div class="callout">${ic("done","glyph g-done")}<span>你定了：${rich(r.answer || "（没写内容）")}</span>${ro ? "" : `<button class="btn text" type="button" data-act="reopen" data-id="${id}">改回待定</button>`}</div>`;

function fbHTML(coll, r, uid){

function itemHTML(r, mk, where){
  const opened = state.open.has(where + ":" + r._id), u = urgency(r), id = esc(r._id);
  const over = [r.owner ? `<span>${esc(r.owner)}</span>` : "", r.area ? `<span>${esc(r.area)}</span>` : "", `<span class="mono">${id}</span>`].join("");
  const tags = [];
  if (isHot(r) && isOpen(r) && r.blocks) tags.push(`<span class="tag t-hot">${ic("block")}卡着 ${esc(r.blocks)}</span>`);
  else if (isOpen(r) && r.blocks) tags.push(`<span class="tag t-hot-soft">影响 ${esc(r.blocks)}</span>`);
  if (r.kind === "AI 欠你" && isOpen(r) && r.waitsOn) tags.push(`<span class="tag t-wait">等${esc(r.waitsOn)}</span>`);
  if (r.kind === "AI 欠你" && r.status === "在做") tags.push(`<span class="tag t-wait">在做</span>`);
  if (r.dispatch && isOpen(r)) tags.push(`<span class="tag t-info">dot 派活单 ${esc(r.dispatch)}</span>`);
  if (r.status === "不做了") tags.push(`<span class="tag t-neutral">不做了</span>`);

    else if ((r.feedbackReply || "").trim() && !newFb(r)) note += `<span class="note">${ic("reply")}<span>总管：${esc(r.feedbackReply)}</span></span>`;

  return `<li class="item ${u}${isOpen(r) || ["wait","next"].includes(stage(r)) ? "" : " closed"}${opened ? " is-open" : ""}" data-id="${id}">
    <div class="lead">${leadHTML(r)}</div>
    <button class="body" type="button" data-act="toggle" data-where="${where}" data-id="${id}" aria-expanded="${opened}">
      <span class="over">${over}</span><span class="head">${esc(r.title)}</span>
      ${sup ? `<span class="sup">${sup}</span>` : ""}${tags.length ? `<span class="tags">${tags.join("")}</span>` : ""}${note}
    </button>

}
function renderItems(t){
  const base = itemsOf(t.kind);
  if (!base.length) return `<div class="empty">这一页还没有内容。</div>`;
  const all = base.filter(match), mk = marks();
  if (!all.length) return `<div class="empty">没有符合筛选的行。换个类别或清空搜索。</div>`;
  const open = all.filter(isOpen), closed = all.filter(r => !isOpen(r));
  let html = "";
  for (const w of WHEN){
    let g = open.filter(r => r.when === w).sort((a,b) => (+a.order || 0) - (+b.order || 0));
    const hotHere = g.filter(isHot);
    if (w === "周三前必须" && MINE.has(t.kind)) g = g.filter(r => !isHot(r));
    const note = w === "周三前必须" && hotHere.length ? `<p class="fold-note">另有 ${hotHere.length} 件卡着别人的在最上面「先处理」里。</p>` : "";
    if (!g.length && !note) continue;
    const list = g.length ? `<ul class="list">${g.map(r => itemHTML(r, mk, "v")).join("")}</ul>` : "";
    if (w === "暂不建议"){
      let o = false; try { o = localStorage.getItem("fwb.later." + t.id) === "1"; } catch (e) {}
      html += `<details class="fold" data-fold="later.${t.id}"${o ? " open" : ""}><summary>${ic("expand")}暂不建议 · 先不做，写着备查（${g.length}）</summary>${list}</details>`;
      continue;
    }
    html += `<section class="group"><h2 class="subhead ${w === "周三前必须" ? "soon" : "later"}">${w === "周三前必须" ? ic("hour") : ""}${esc(w)}<span class="muted">${w === "周三前必须" ? `本次必须做 · 还剩 ${hoursLeft()} 小时 · ${g.length} 条` : `可后做 · ${g.length} 条`}</span></h2>${note}${list}</section>`;
  }
  if (!open.length) html += `<div class="empty">这一页都处理完了。</div>`;
  const follow = closed.filter(r => ["wait","next"].includes(stage(r)));
  if (follow.length){
    follow.sort((a,b) => (stage(a) === "wait" ? 0 : 1) - (stage(b) === "wait" ? 0 : 1) || String(b.doneAt || "").localeCompare(String(a.doneAt || "")));
    const nw = follow.filter(r => stage(r) === "wait").length;
    html += `<section class="group"><h2 class="subhead">${ic("reply")}你已处理 · 待下一步<span class="muted">${nw ? `${nw} 件等总管处理 · ` : ""}${follow.length - nw} 件已转出、等负责的对话框做下一步 · 做完会移到下面「已完成」</span></h2><ul class="list">${follow.map(r => itemHTML(r, mk, "v")).join("")}</ul></section>`;
  }
  const rest = closed.filter(r => !follow.includes(r));
  closed.length = 0; closed.push(...rest);
  if (closed.length){
    let o = false; try { o = localStorage.getItem("fwb.fold." + t.id) === "1"; } catch (e) {}
    closed.sort((a,b) => String(b.doneAt || b.updatedAt || "").localeCompare(String(a.doneAt || a.updatedAt || "")));
    html += `<details class="fold" data-fold="fold.${t.id}"${o ? " open" : ""}><summary>${ic("expand")}${t.kind === "你要定" ? "已定 · 不做了" : "已完成 · 不做了"}（${closed.length}）</summary><ul class="list">${closed.map(r => itemHTML(r, mk, "v")).join("")}</ul></details>`;
  }
  return html;
}

/* ---------- resources / dialogs / updates ---------- */
function renderResources(){
  const rows = state.rows.resources.filter(match).sort((a,b) => (+a.order || 0) - (+b.order || 0));
  if (!state.rows.resources.length) return `<div class="empty">还没有资源行。</div>`;
  if (!rows.length) return `<div class="empty">没有符合搜索的资源。</div>`;
  let html = `<div class="table-wrap"><table><thead><tr><th>资源</th><th>做法 · 你的要求</th><th>PC</th><th>手游</th><th>下一步 · 谁</th><th>周三</th><th>反馈</th></tr></thead><tbody>`, last = null;
  for (const r of rows){
    const opened = state.open.has("r:" + r._id), id = esc(r._id);
    if (r.cat !== last){ last = r.cat; html += `<tr class="cat"><td colspan="7">${esc(r.cat || "其他")}</td></tr>`; }
    html += `<tr class="row${r.wed === "周三必须" ? " wed" : ""}${opened ? " is-open" : ""}" tabindex="0" data-act="toggle" data-where="r" data-id="${id}" aria-expanded="${opened}">
      <td><div class="name">${esc(r.name)}</div><div class="small">${esc(r.size)}${r.alsoUsed ? " · 也用作 " + esc(r.alsoUsed) : ""}</div><div class="small mono">${esc(r.rid)}${r.cost ? " · " + esc(r.cost) : ""}</div></td>
      <td class="wrap">${r.how ? `<span class="tag ${HOW_TAG[r.how] || "t-neutral"}">${esc(r.how)}</span>` : ""}<div>${esc(r.ask)}</div></td>
      <td class="wrap">${esc(r.pc)}</td>
      <td class="wrap">${esc(r.mob)}${r.mob && r.mob !== "不上" && r.mobState ? `<div class="small">${esc(r.mobState)}</div>` : ""}</td>
      <td class="wrap">${esc(r.next)}</td>
      <td>${r.wed === "周三必须" ? `<span class="tag t-hot-soft">周三必须</span>` : `<span class="small">${esc(r.wed)}</span>`}</td>
      <td>${newFb(r) ? `<span class="tag t-wait">已反馈 · 等总管</span>` : (r.feedback || "").trim() ? `<span class="tag t-ok">总管已看</span>` : `<span class="small">${ic("comment")}</span>`}</td></tr>`;
    if (opened){
      const kv = [["PC 粒子", r.part], ["手游进度", r.mobState], ["说明", r.detail]].filter(([,v]) => v && String(v).trim()).map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
      html += `<tr class="exp"><td colspan="7"><div class="more" style="padding-left:0">${kv ? `<dl class="kv">${kv}</dl>` : ""}${fbHTML("resources", r, "r-" + r._id)}${state.canWrite ? `<div class="row-actions"><button class="btn text" type="button" data-act="edit" data-coll="resources" data-id="${id}">${ic("edit")}编辑这一行</button></div>` : ""}</div></td></tr>`;
    }
  }
  return html + `</tbody></table></div>`;
}
function renderDialogs(){
  const rows = state.rows.dialogs.filter(match).sort((a,b) => (+a.order || 0) - (+b.order || 0));
  if (!rows.length) return `<div class="empty">没有符合搜索的对话框。</div>`;
  return `<div class="cards">${rows.map(r => {
    const opened = state.open.has("d:" + r._id), id = esc(r._id);
    return `<div class="card${r.state === "等你" ? " waiting" : ""}">
      <button class="card-hd" type="button" data-act="toggle" data-where="d" data-id="${id}" aria-expanded="${opened}">
        <span class="row1"><span class="h3"><strong style="font-size:15px">${esc(r.name)}</strong></span>${r.state ? `<span class="tag ${STATE_TAG[r.state] || "t-neutral"}">${esc(r.state)}</span>` : ""}${r.where ? `<span class="tag t-info">${esc(r.where)}</span>` : ""}${newFb(r) ? `<span class="tag t-wait">已反馈 · 等总管</span>` : ""}</span>
        <span class="mono muted">${esc(r.code)}</span>
        <span class="kv"><span class="dt">手上</span><span class="dd">${esc(r.now || "—")}</span><span class="dt">没做完</span><span class="dd">${esc(r.open || "—")}</span></span>
      </button>
      ${opened ? `<div class="more">${r.scope ? `<dl class="kv"><dt>管什么</dt><dd>${esc(r.scope)}</dd></dl>` : ""}${fbHTML("dialogs", r, "d-" + r._id)}${state.canWrite ? `<div class="row-actions"><button class="btn text" type="button" data-act="edit" data-coll="dialogs" data-id="${id}">${ic("edit")}编辑</button></div>` : ""}</div>` : ""}
    </div>`; }).join("")}</div>`;
}
function renderUpdates(){
  const reps = state.rows.reports.filter(match).sort((a,b) => String(b.at).localeCompare(String(a.at)));
  if (!reps.length) return `<div class="empty">还没有更新记录。</div>`;
  const titleOf = id => (rowById("items", id) || {}).title || "";
  const ids = (h, xs) => xs && xs.length ? `<h4>${h}（${xs.length}）</h4><ul>${xs.map(id => `<li><span class="mono muted">${esc(id)}</span> ${esc(titleOf(id))}</li>`).join("")}</ul>` : "";
  const lines = (h, xs) => xs && xs.length ? `<h4>${h}</h4><ul>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  return `<div class="updates">${reps.map(r => `<article class="card rep"><span class="mono muted">${esc(String(r.at).replace("T"," ").slice(0,16))} · ${esc(r.by || "总管（21）")}</span><strong style="font-size:15px">${r.kind === "daily" ? `<span class="tag t-next" style="margin-right:6px">每日巡检</span>` : ""}${esc(r.title)}</strong>${r.summary ? `<p>${esc(r.summary)}</p>` : ""}${lines("今天先看", r.today)}${lines("要你看 / 要你定", r.needYou)}${lines("你反馈过的去向", r.routed)}${lines("要你打开的对话框", r.openDialogs)}${lines("发现的问题", r.findings)}${ids("新加的行", r.added)}${ids("改了的行", r.changed)}${ids("关掉的行", r.closed)}</article>`).join("")}</div>`;
}

function editing(){ const a = document.activeElement; return !!(a && a.matches && a.matches("#view textarea, #focus textarea")); }
function render(force){
  if (!force && editing()){ state.pending = true; return; }
  state.pending = false;
  renderDeadline(); renderTabs(); renderFocus(); renderChips();
  const t = tabDef();
  $("#hint").textContent = t.hint;
  $("#add").hidden = !state.canWrite || t.coll === "reports";
  const v = $("#view");
  v.setAttribute("aria-labelledby", "tab-" + t.id);
  if (!state.loaded[t.coll]){ v.innerHTML = `<div class="empty">${state.offline === null ? "这个视图读不到共享数据。用 claude.ai 登录后打开这页。" : "正在读取…"}</div>`; return; }
  v.innerHTML = t.coll === "items" ? renderItems(t) : t.coll === "resources" ? renderResources() : t.coll === "dialogs" ? renderDialogs() : renderUpdates();
}

/* ---------- writes ---------- */
let snackTimer = null;
function snack(msg, undo){
  const el = $("#snack"); clearTimeout(snackTimer);
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button class="btn" type="button" id="undo">撤销</button>` : ""}`;
  el.hidden = false;
  if (undo) $("#undo").addEventListener("click", async () => { el.hidden = true; await undo(); });
  snackTimer = setTimeout(() => { el.hidden = true; }, undo ? 7000 : 3500);
}
async function write(coll, id, patch){
  if (!state.db || !state.canWrite) throw Object.assign(new Error("readonly"), { code: "readonly" });
  patch.updatedAt = new Date().toISOString();
  await state.db.collection(coll).doc(id).update(patch);
  const r = rowById(coll, id); if (r) Object.assign(r, patch);
}
const errText = e => e && (e.code === "invalid_argument" || e.code === "readonly") ? "你在这页只有查看权限，改不了。" : "没保存成功，请稍后再试。";
const before = (r, keys) => { const o = {}; for (const k of keys) o[k] = r[k] ?? ""; return o; };
async function markDone(r, extra, msg){
  const prev = before(r, ["status","statusBefore","doneAt","syncedAt","syncedTo","answer","next","nextDoneAt"]);
  await write("items", r._id, Object.assign({ status:"已做", statusBefore: isOpen(r) ? (r.status || "没做") : "没做", doneAt: new Date().toISOString(), syncedAt:"", syncedTo:"", next:"", nextDoneAt:"" }, extra || {}));
  delete state.drafts["ans:items:" + r._id];
  render(true);
  snack(msg, async () => { try { await write("items", r._id, prev); render(true); snack("已撤销。"); } catch (e) { snack(errText(e)); } });
}
async function reopen(r){
  const prev = before(r, ["status","statusBefore","doneAt","syncedAt","syncedTo","next","nextDoneAt"]);
  await write("items", r._id, { status: r.statusBefore && OPEN.has(r.statusBefore) ? r.statusBefore : "没做", doneAt:"", syncedAt:"", syncedTo:"", next:"", nextDoneAt:"" });
  render(true);
  snack("已改回没完成。", async () => { try { await write("items", r._id, prev); render(true); } catch (e) { snack(errText(e)); } });
}
async function saveFb(ta){
  const [coll, id] = ta.dataset.fb.split(":"), r = rowById(coll, id), st = document.querySelector(`[data-fbs="${CSS.escape(ta.dataset.fb)}"]`);
  if (!r || (r.feedback || "") === ta.value){ delete state.drafts["fb:" + ta.dataset.fb]; return; }
  try { if (st) st.textContent = "保存中…"; await write(coll, id, { feedback: ta.value, feedbackAt: new Date().toISOString() }); delete state.drafts["fb:" + ta.dataset.fb]; if (st) st.textContent = "已保存 · 等总管看"; }
  catch (e){ if (st) st.textContent = errText(e); }
}

/* ---------- edit sheet (editing / adding rows only) ---------- */
function openSheet(coll, id){
  const r = id ? rowById(coll, id) : null, t = tabDef();
  state.sheet = { coll, id, trigger: document.activeElement };
  $("#sheetHost").innerHTML = `<div class="scrim" data-act="close"></div>
    <aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head"><h2 id="sheetTitle">${r ? "编辑：" + esc(r.title || r.name) : "新增：" + esc(t.kind || t.label)}</h2><button class="icon-btn" type="button" data-act="close" aria-label="关闭">${ic("close")}</button></div>
      <div class="sheet-body">${FIELDS[coll].map(([k,label,type,opts]) => {
        const fid = "ed-" + k, v = r ? (r[k] ?? "") : (k === "kind" ? (t.kind || "") : k === "status" ? "没做" : k === "when" ? "周三前必须" : "");
        if (type === "select") return `<label for="${fid}">${label}<select class="field" id="${fid}" data-k="${k}">${opts.includes("") ? "" : `<option value=""></option>`}${opts.map(o => `<option${String(o) === String(v) ? " selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
        if (type === "area") return `<label for="${fid}">${label}<textarea class="field" id="${fid}" data-k="${k}">${esc(v)}</textarea></label>`;
        return `<label for="${fid}">${label}<input class="field" id="${fid}" data-k="${k}" type="${type === "number" ? "number" : "text"}" value="${esc(v)}"></label>`;
      }).join("")}</div>
      <div class="sheet-foot">${r ? `<span id="delZone" style="margin-right:auto"><button class="btn danger" type="button" data-act="del">删除这一行</button></span>` : ""}<button class="btn text" type="button" data-act="close">取消</button><button class="btn filled" type="button" data-act="save">保存</button></div>
    </aside>`;
  $("#sheetHost .field").focus();
}
function closeSheet(){ const tr = state.sheet && state.sheet.trigger; state.sheet = null; $("#sheetHost").innerHTML = ""; render(true); if (tr && document.contains(tr)) tr.focus(); }
$("#sheetHost").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"), s = state.sheet; if (!b || !s) return;
  const r = s.id ? rowById(s.coll, s.id) : null;
  try {
    if (b.dataset.act === "close") return closeSheet();
    if (b.dataset.act === "del"){ $("#delZone").innerHTML = `<span class="muted">确定删掉？</span> <button class="btn danger" type="button" data-act="delYes">删除</button> <button class="btn text" type="button" data-act="delNo">不删</button>`; return; }
    if (b.dataset.act === "delNo"){ $("#delZone").innerHTML = `<button class="btn danger" type="button" data-act="del">删除这一行</button>`; return; }
    if (b.dataset.act === "delYes"){ await state.db.collection(s.coll).doc(s.id).delete(); closeSheet(); snack("已删除。"); return; }
    if (b.dataset.act === "save"){
      const out = {};
      document.querySelectorAll("#sheetHost [data-k]").forEach(el => { out[el.dataset.k] = el.type === "number" ? (el.value === "" ? 0 : Number(el.value)) : el.value; });
      if (r){ const diff = {}; for (const k in out) if (String(r[k] ?? "") !== String(out[k])) diff[k] = out[k]; if (Object.keys(diff).length) await write(s.coll, s.id, diff); }
      else { if (!state.db || !state.canWrite) throw Object.assign(new Error("readonly"), { code:"readonly" }); out.updatedAt = new Date().toISOString(); await state.db.collection(s.coll).add(out); }
      closeSheet(); snack(r ? "已保存。" : "已新增。");
    }
  } catch (err){ snack(errText(err)); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.sheet) closeSheet(); });

/* ---------- page events ---------- */
function setTab(id){ state.tab = id; state.area = ""; try { localStorage.setItem("fwb.tab", id); history.replaceState(null, "", "#" + id); } catch (e) {} render(true); }
$("#tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) setTab(b.dataset.tab); });
$("#tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const i = TABS.findIndex(t => t.id === state.tab), n = TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length];
  setTab(n.id); $("#tab-" + n.id).focus();
});
$("#chips").addEventListener("click", e => { const b = e.target.closest("[data-area]"); if (b){ state.area = b.dataset.area; render(true); } });
$("#q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(true); });
$("#add").addEventListener("click", () => openSheet(tabDef().coll, null));

async function onAct(e){
  const b = e.target.closest("[data-act]"); if (!b || b.closest("#sheetHost")) return;
  const act = b.dataset.act, id = b.dataset.id;
  try {
    if (act === "toggle"){
      const key = b.dataset.where + ":" + id, f = b.dataset.focus;
      if (state.open.has(key) && f !== "ans") state.open.delete(key); else state.open.add(key);
      render(true);
      if (state.open.has(key) && f){
        const target = document.getElementById(f + "-" + b.dataset.where + "-" + id);
        if (target){ target.focus(); target.setSelectionRange(target.value.length, target.value.length); }
      }
      return;
    }
    if (act === "accept"){ const r = rowById("items", id); if (r) await markDone(r, { answer: "按推荐：" + (r.recommend || "") }, "已按推荐定 · 等总管处理：" + r.title); return; }
    if (act === "answer"){
      const ta = document.getElementById("ans-" + b.dataset.uid), v = (ta && ta.value || "").trim(), r = rowById("items", id);
      if (!v){ ta && ta.focus(); return snack("先写一句你定了什么，或者点「按推荐定」。"); }
      await markDone(r, { answer: v }, "已记下你的决定 · 等总管处理。"); return;
    }
    if (act === "reopen"){ const r = rowById("items", id); if (r) await reopen(r); return; }
    if (act === "edit") return openSheet(b.dataset.coll, id);
  } catch (err){ snack(errText(err)); }
}
for (const host of ["#view", "#focus"]){
  const el = $(host);
  el.addEventListener("click", onAct);
  el.addEventListener("change", async e => {
    const cb = e.target; if (!cb.dataset || !cb.dataset.done) return;
    const r = rowById("items", cb.dataset.done); if (!r) return;
    cb.disabled = true;
    try { if (cb.checked) await markDone(r, {}, "已标记做好了 · 等总管处理：" + r.title); else await reopen(r); }
    catch (err){ cb.checked = !cb.checked; cb.disabled = false; snack(errText(err)); }
  });
  el.addEventListener("input", e => { const ta = e.target; if (ta.dataset && ta.dataset.draft) state.drafts[ta.dataset.draft] = ta.value; });
  el.addEventListener("keydown", async e => {
    const ta = e.target;
    if (ta.dataset && ta.dataset.fb && e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); await saveFb(ta); }
    if ((e.key === "Enter" || e.key === " ") && ta.matches && ta.matches("tr[data-act]")){ e.preventDefault(); onAct({ target: ta }); }
  });
  el.addEventListener("focusout", async e => {
    const ta = e.target;
    if (ta.dataset && ta.dataset.fb) await saveFb(ta);
    setTimeout(() => { if (state.pending && !editing()) render(true); }, 0);
  });
  el.addEventListener("toggle", e => { const d = e.target; if (d.dataset && d.dataset.fold){ try { localStorage.setItem("fwb." + d.dataset.fold, d.open ? "1" : "0"); } catch (err) {} } }, true);
}
$("#focus").addEventListener("click", e => {
  const go = e.target.closest("[data-go]"); if (go) return setTab(go.dataset.go);
  if (!e.target.closest("#focusToggle")) return;
  state.focusOpen = !state.focusOpen; try { localStorage.setItem("fwb.focus", state.focusOpen ? "1" : "0"); } catch (err) {} render(true);
});
setInterval(() => { renderDeadline(); }, 60000);

/* ---------- data ---------- */
render(true);
(async () => {
  let db = null;
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db){
    state.offline = null;
    let s = null; try { s = JSON.parse(document.getElementById("snap").textContent); } catch (e) { s = null; }
    if (s && s.items){
      state.offline = true;
      for (const coll of ["items","resources","dialogs","reports"]){
        const src = s[coll] || {};
        state.rows[coll] = Object.keys(src).map(k => Object.assign({ _id: k }, src[k]));
        state.loaded[coll] = true;
      }
      const b = $("#banner"); b.hidden = false;
      b.innerHTML = `${ic("info")}<span>离线副本：${esc(String(s["导出时间"] || "").replace("T"," ").slice(0,16))} 导出，只能看。要勾选、作答、写反馈，请打开<a href="${BOARD_URL}" target="_blank" rel="noopener">在线看板</a>。</span>`;
    }
    render(true); return;
  }
  state.db = db; state.canWrite = true; state.offline = false;
  try { const user = await window.claude?.use?.("user"); const can = user ? await user.can("data.write") : null; if (can === false) state.canWrite = false; } catch (e) {}
  db.collection("reports").orderBy("at", "desc").onSnapshot(snap => {
    state.rows.reports = snap.docs.map(d => Object.assign({ _id: d.id }, d.data())); state.loaded.reports = true; render();
  }, () => { state.loaded.reports = true; render(); });
  for (const coll of ["items","resources","dialogs"]){
    db.collection(coll).orderBy("order").onSnapshot(snap => {
      state.rows[coll] = snap.docs.map(d => Object.assign({ _id: d.id }, d.data())); state.loaded[coll] = true; render();
    }, () => { state.loaded[coll] = true; snack("读取时出错了，刷新页面再试。"); render(); });
  }
})();
})();
</script>
