<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>烘焙器完整参数分类样板 · A/B</title><link rel="stylesheet" href="../../../../tool/design-system/tokens.css"><link rel="stylesheet" href="sample.css"></head>
<body class="fw-scope"><header class="app-header"><div><strong>烟花烘焙器</strong><span>完整参数分类样板</span></div><nav><a href="../baker-context/">烘焙器整页方案</a> · <a href="../设计册.html">原方案与映射</a></nav></header>
<div class="notice">隔离设计样板 · <b id="version">加载字段</b> · 各条件分支完整列出；不把所有字段当成同一配方可用。数值贯通操作在“千轮 · 子花18项”，其余用于完整分类核对。</div>
<div class="workspace"><aside><div class="catalog-heading"><strong>作用对象与工作区</strong><span id="total"></span></div><nav id="object-nav" aria-label="参数对象"></nav><div class="aside-foot"><a href="字段映射.csv">完整字段CSV</a><a href="coverage.json">A/B逐ID对齐</a></div></aside>
<main><div class="context-bar"><div><h1 id="object-title">完整模块与字段</h1><p id="object-note"></p></div><div class="shape-toggle" role="group" aria-label="形状候选"><button type="button" data-shape="C" aria-pressed="true">共享 8/12/16</button><button type="button" data-shape="S" aria-pressed="false">小圆角 4/6/8</button></div></div>
<div class="view-controls"><label>查找字段 <input id="search" type="search" placeholder="名称、字段ID、模块"></label><label><input type="checkbox" id="only-changed"> 仅改动（操作样板）</label><button type="button" id="open-all">展开全部模块</button><span id="shown"></span></div>
<div class="compare"><article class="variant" data-variant="A"><header><div><strong>A</strong><h2>原九模块与领域模块</h2></div><span id="count-A"></span></header><div class="variant-content" id="view-A"></div></article><article class="variant" data-variant="B"><header><div><strong>B</strong><h2>按制作任务重组</h2></div><span id="count-B"></span></header><div class="variant-content" id="view-B"></div></article></div>
<footer class="edit-footer"><span id="change-status">操作样板：未改动</span><div><button type="button" id="undo">撤销</button><button type="button" id="redo">重做</button><button type="button" id="restore">恢复样板打开时</button></div></footer><p class="scope-note">两案共用同一字段、条件与样板数据。全量核对默认展开用于检查完整性；它不代表生产默认展开策略。B分类与形状仍待选择，Material提供组件/状态指导，不规定烟花参数分类。</p></main></div>
<dialog id="field-help"><header><h2 id="help-title"></h2><button type="button" id="help-close">关闭</button></header><div id="help-content"></div></dialog><p id="announce" class="sr-only" role="status" aria-live="polite"></p><script type="module" src="sample.mjs"></script></body></html>
