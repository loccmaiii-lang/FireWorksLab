<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网格垂柳 · 鸿巢四尺玉 · Cascade 仿真预览 v1</title>
<style>
html,body{margin:0;height:100%;background:#05070b;color:#d9dee8;font:13px/1.5 system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#ui{position:absolute;left:12px;top:12px;width:300px;background:rgba(14,18,26,.86);border:1px solid #2a3344;border-radius:10px;padding:10px 12px}
#ui h1{font-size:14px;font-weight:500;margin:0 0 6px}
#ui label{display:flex;align-items:center;gap:8px;margin:5px 0}
#ui label span{width:76px;color:#9aa6ba;flex:none}
#ui input[type=range]{flex:1}
#ui .v{width:56px;text-align:right;font-variant-numeric:tabular-nums}
#ui .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
#ui button{background:#1c2433;color:#d9dee8;border:1px solid #33405a;border-radius:6px;padding:3px 8px;cursor:pointer;font:inherit}
#ui button.on{background:#2f4d6e;border-color:#4b78a8}
#stat{color:#9aa6ba;font-size:12px;margin-top:6px;white-space:pre-line}
#t{position:absolute;right:14px;top:12px;font-size:22px;font-variant-numeric:tabular-nums;color:#e8edf5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="t">+0.00 s</div>
<div id="ui">
  <h1>网格垂柳 · 鸿巢四尺玉（主层）</h1>
  <div class="row" id="nBtns"></div>
  <label><span>开花后</span><input id="time" type="range" min="0" max="11" step="0.01" value="3.3"><b class="v" id="timeV"></b></label>
  <div class="row"><button id="play">▶ 播放</button><button data-t="1">1.0</button><button data-t="2.4">2.4</button><button data-t="3.3">3.3</button><button data-t="5.3">5.3</button><button data-t="7">7.0</button><button data-t="8.3">8.3</button><button data-t="9.3">9.3</button></div>
  <label><span>观察距离</span><input id="dist" type="range" min="400" max="1600" step="10" value="1000"><b class="v" id="distV"></b></label>
  <label><span>仰角</span><input id="elev" type="range" min="-89" max="89" step="1" value="-22"><b class="v" id="elevV"></b></label>
  <label><span>方位</span><input id="azim" type="range" min="-180" max="180" step="1" value="0"><b class="v" id="azimV"></b></label>
  <label><span>放大</span><input id="zoom" type="range" min="1" max="6" step="0.05" value="1"><b class="v" id="zoomV"></b></label>
  <label><span>亮度倍数</span><input id="bright" type="range" min="2" max="60" step="1" value="18"><b class="v" id="brightV"></b></label>
  <div class="row"><button id="pGame">游戏视角（地面 1000 m 外仰看）</button><button id="pBelow">正下方仰看</button><button id="pSide">平视</button><button id="pOrbit">绕一圈</button><button id="pBloom" class="on">光晕</button></div>
  <div id="stat"></div>
</div>
<script src="data/meta.js"></script>
<script src="data/strip.js"></script>
<script src="data/N200.js"></script>
<script src="data/N300.js"></script>
<script src="data/N400.js"></script>
<script>
(() => {
const M = window.MESH_WILLOW_META, D = window.MESH_WILLOW;
const cv = document.getElementById('c'), gl = cv.getContext('webgl2', { antialias: true, premultipliedAlpha: false });
if (!gl) { document.body.innerHTML = '<p style="padding:20px">这个浏览器不支持 WebGL2</p>'; return; }
const hasF = !!gl.getExtension('EXT_color_buffer_float');
const $ = id => document.getElementById(id);
const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(s)); return s; };
const prog = (vs, fs) => { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(p)); return p; };
// 与 UE 材质 M_EFX_DissolveOutline_Soft（Translucent / Unlit）同一算式：MainTex.uv = UV0 + DP0 × (0,1)；自发光 = RGB × 粒子颜色 × 亮度；不透明度 = A × 粒子 Alpha
const pMesh = prog(`#version 300 es
layout(location=0) in vec3 aPos; layout(location=1) in vec2 aUV;
uniform mat4 uVP; uniform float uYaw; out vec2 vUV;
void main(){ float c=cos(uYaw), s=sin(uYaw); vec3 p=vec3(c*aPos.x+s*aPos.z, aPos.y, -s*aPos.x+c*aPos.z); vUV=aUV; gl_Position=uVP*vec4(p,1.); }`,
`#version 300 es
precision highp float; in vec2 vUV; uniform sampler2D uTex; uniform float uDP0, uAlpha, uK; uniform vec3 uCol; out vec4 o;
void main(){ vec4 t=texture(uTex, vec2(vUV.x, vUV.y+uDP0)); o=vec4(t.rgb*uCol*uK, t.a*uAlpha); }`);
const pLine = prog(`#version 300 es
layout(location=0) in vec3 aPos; uniform mat4 uVP; void main(){ gl_Position=uVP*vec4(aPos,1.); }`,
`#version 300 es
precision highp float; uniform vec4 uC; out vec4 o; void main(){ o=uC; }`);
const quadVS = `#version 300 es
layout(location=0) in vec2 aP; out vec2 vT; void main(){ vT=aP*.5+.5; gl_Position=vec4(aP,0.,1.); }`;
const pBlur = prog(quadVS, `#version 300 es
precision highp float; in vec2 vT; uniform sampler2D uS; uniform vec2 uD; out vec4 o;
void main(){ vec3 c=vec3(0.); float w[5]=float[5](.227,.194,.121,.054,.016); c+=texture(uS,vT).rgb*w[0];
 for(int i=1;i<5;i++){ c+=texture(uS,vT+uD*float(i)).rgb*w[i]; c+=texture(uS,vT-uD*float(i)).rgb*w[i]; } o=vec4(c,1.); }`);
const pTone = prog(quadVS, `#version 300 es
precision highp float; in vec2 vT; uniform sampler2D uS, uB; uniform float uBloom; out vec4 o;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
void main(){ vec3 c=texture(uS,vT).rgb + uBloom*texture(uB,vT).rgb; c=aces(c*.6); o=vec4(pow(c,vec3(1./2.2)),1.); }`);
const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const dec = (s, T) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T(u.buffer); };
const meshes = {};
for (const k of Object.keys(D)) {
  const d = D[k], pos = dec(d.pos, Float32Array), uv = dec(d.uv, Float32Array), idx = dec(d.idx, Uint32Array);
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const b0 = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b0); gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  const b1 = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b1); gl.bufferData(gl.ARRAY_BUFFER, uv, gl.STATIC_DRAW); gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 0, 0);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  meshes[k] = { vao, n: idx.length, meta: d.meta };
}
gl.bindVertexArray(null);
// 地面网格（看出世界固定、不跟镜头转）：开花点下方 400 m（主角尾缀 RiseTrail_Hero_L 开花高度），100 m 一格
const GROUND = -400, lines = [];
for (let i = -1500; i <= 1500; i += 100) { lines.push(i, GROUND, -1500, i, GROUND, 1500, -1500, GROUND, i, 1500, GROUND, i); }
lines.push(0, GROUND, 0, 0, 0, 0);
const lb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, lb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(lines), gl.STATIC_DRAW);
const lvao = gl.createVertexArray(); gl.bindVertexArray(lvao); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0); gl.bindVertexArray(null);
// 条带贴图：sRGB、Clamp、mip（和 UE 导入设置一致）
const tex = gl.createTexture(), img = new Image();
img.onload = () => { gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.SRGB8_ALPHA8, gl.RGBA, gl.UNSIGNED_BYTE, img); gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); ready = true; };
let ready = false; img.src = window.MESH_WILLOW_STRIP;
// HDR 目标 + 光晕
let W = 0, H = 0, fb = {};
const mkRT = (w, h) => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, hasF ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, hasF ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return { t, f, w, h }; };
function resize() { const r = Math.min(2, devicePixelRatio || 1), w = Math.round(cv.clientWidth * r), h = Math.round(cv.clientHeight * r); if (w === W && h === H) return; W = cv.width = w; H = cv.height = h;
  fb.main = mkRT(W, H); fb.a = mkRT(W >> 2, H >> 2); fb.b = mkRT(W >> 2, H >> 2); }
// 状态
const st = { N: 'N400', t: +$('time').value, play: false, bloom: true, orbit: false, yawSeed: 0 };
const nb = $('nBtns'); for (const k of Object.keys(meshes)) { const b = document.createElement('button'); b.textContent = k.slice(1) + ' 束'; b.onclick = () => { st.N = k; sync(); }; b.dataset.n = k; nb.appendChild(b); }
const val = id => +$(id).value;
function sync() { for (const b of nb.children) b.classList.toggle('on', b.dataset.n === st.N);
  $('timeV').textContent = st.t.toFixed(2); $('distV').textContent = val('dist') + ' m'; $('elevV').textContent = val('elev') + '°'; $('azimV').textContent = val('azim') + '°'; $('zoomV').textContent = '×' + val('zoom').toFixed(2); $('brightV').textContent = val('bright');
  const m = meshes[st.N].meta; $('stat').textContent = `${m.束数} 束 · 顶点 ${m.顶点} · 三角 ${m.三角} · 每束 ${m.每束平均段数} 段\n星头位置误差 p95 ${m.误差.之后_p95_m} m（开花 0.6 s 内 ${m.误差.开花早段_p95_m} m）\n熄灭 p5/p50/p95 ${m.熄灭时刻_s.p5} / ${m.熄灭时刻_s.p50} / ${m.熄灭时刻_s.p95} s\n世界固定朝向（不跟镜头转）· 十字带 ${M.W} m\n烘焙器 ${M.烘焙器} · ${M.配方}`; }
for (const id of ['dist', 'elev', 'azim', 'zoom', 'bright']) $(id).oninput = sync;
$('time').oninput = () => { st.t = val('time'); sync(); };
$('play').onclick = () => { st.play = !st.play; if (st.play && st.t >= 9.9) st.t = 0; $('play').textContent = st.play ? '❚❚ 暂停' : '▶ 播放'; };
for (const b of document.querySelectorAll('[data-t]')) b.onclick = () => { st.t = +b.dataset.t; $('time').value = st.t; sync(); };
$('pGame').onclick = () => { $('dist').value = 1000; $('elev').value = -22; $('zoom').value = 1; sync(); };
$('pBelow').onclick = () => { $('dist').value = 400; $('elev').value = -88; $('zoom').value = 1; sync(); };
$('pSide').onclick = () => { $('dist').value = 1000; $('elev').value = 0; $('zoom').value = 1; sync(); };
$('pOrbit').onclick = () => { st.orbit = !st.orbit; $('pOrbit').classList.toggle('on', st.orbit); };
$('pBloom').onclick = () => { st.bloom = !st.bloom; $('pBloom').classList.toggle('on', st.bloom); };
let drag = null; cv.onpointerdown = e => { drag = [e.clientX, e.clientY, val('azim'), val('elev')]; cv.setPointerCapture(e.pointerId); };
cv.onpointermove = e => { if (!drag) return; let a = drag[2] - (e.clientX - drag[0]) * 0.3; a = ((a + 540) % 360) - 180; $('azim').value = a; $('elev').value = Math.max(-89, Math.min(89, drag[3] + (e.clientY - drag[1]) * 0.25)); sync(); };
cv.onpointerup = () => drag = null;
cv.onwheel = e => { $('zoom').value = Math.max(1, Math.min(6, val('zoom') * (e.deltaY < 0 ? 1.1 : 1 / 1.1))); sync(); e.preventDefault(); };
// 矩阵
const persp = (fy, a, n, f) => { const t = 1 / Math.tan(fy / 2); return [t / a, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, 2 * f * n / (n - f), 0]; };
const look = (e, c, u) => { const z = norm(sub(e, c)), x = norm(cross(u, z)), y = cross(z, x); return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1]; };
const mul = (a, b) => { const o = new Array(16).fill(0); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) for (let k = 0; k < 4; k++) o[j * 4 + i] += a[k * 4 + i] * b[j * 4 + k]; return o; };
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], norm = a => { const l = Math.hypot(...a) || 1; return a.map(x => x / l); };
const alphaAt = t => { const k = M.alpha; if (t <= k[0][0]) return k[0][1]; for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const u = (t - k[i - 1][0]) / (k[i][0] - k[i - 1][0]); return k[i - 1][1] + (k[i][1] - k[i - 1][1]) * u; } return k[k.length - 1][1]; };
const hexLin = h => [1, 3, 5].map(i => Math.pow(parseInt(h.slice(i, i + 2), 16) / 255, 2.2));
const colAt = t => { const s = M.stages; let c = s[0][1]; for (const [tt, cc] of s) if (t >= tt) c = cc; return hexLin(c); };
// 「游戏内大小」：标准 2.1 —— 1000 m 时 700 m ≈ 屏幕高 1/3 → 竖直视角 2·atan(1.05)
const FOV = 2 * Math.atan(1.05);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (st.play) { st.t += dt; if (st.t > M.L) st.t = 0; $('time').value = st.t; $('timeV').textContent = st.t.toFixed(2); }
  if (st.orbit) { let a = val('azim') + dt * 20; if (a > 180) a -= 360; $('azim').value = a; $('azimV').textContent = Math.round(a) + '°'; }
  $('t').textContent = '+' + st.t.toFixed(2) + ' s';
  resize();
  if (ready) {
    const el = val('elev') * Math.PI / 180, az = val('azim') * Math.PI / 180, d = val('dist');
    const eye = [d * Math.cos(el) * Math.sin(az), d * Math.sin(el) - 1e-3, d * Math.cos(el) * Math.cos(az)];
    const up = [0, 1, 0];
    const target = [0, 0, 0];
    const vp = mul(persp(FOV / val('zoom'), W / H, 5, 6000), look(eye, target, up));
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb.main.f); gl.viewport(0, 0, W, H); gl.clearColor(0.004, 0.006, 0.012, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND);
    gl.useProgram(pLine); gl.uniformMatrix4fv(gl.getUniformLocation(pLine, 'uVP'), false, vp); gl.uniform4f(gl.getUniformLocation(pLine, 'uC'), 0.05, 0.07, 0.1, 1);
    gl.blendFunc(gl.ONE, gl.ONE); gl.bindVertexArray(lvao); gl.drawArrays(gl.LINES, 0, lines.length / 3);
    const m = meshes[st.N];
    gl.useProgram(pMesh); gl.uniformMatrix4fv(gl.getUniformLocation(pMesh, 'uVP'), false, vp); gl.uniform1f(gl.getUniformLocation(pMesh, 'uYaw'), st.yawSeed);
    gl.uniform1f(gl.getUniformLocation(pMesh, 'uDP0'), M.H - st.t / M.S); gl.uniform1f(gl.getUniformLocation(pMesh, 'uAlpha'), alphaAt(st.t));
    gl.uniform1f(gl.getUniformLocation(pMesh, 'uK'), val('bright')); gl.uniform3fv(gl.getUniformLocation(pMesh, 'uCol'), colAt(st.t));
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(gl.getUniformLocation(pMesh, 'uTex'), 0);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindVertexArray(m.vao); gl.drawElements(gl.TRIANGLES, m.n, gl.UNSIGNED_INT, 0);
    gl.disable(gl.BLEND); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    const fsq = (p, src, dst, w, h) => { gl.bindFramebuffer(gl.FRAMEBUFFER, dst); gl.viewport(0, 0, w, h); gl.useProgram(p); const va = gl.createVertexArray(); gl.bindVertexArray(va); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src); gl.uniform1i(gl.getUniformLocation(p, 'uS'), 0); return va; };
    let va = fsq(pBlur, fb.main.t, fb.a.f, fb.a.w, fb.a.h); gl.uniform2f(gl.getUniformLocation(pBlur, 'uD'), 2 / W, 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.deleteVertexArray(va);
    va = fsq(pBlur, fb.a.t, fb.b.f, fb.b.w, fb.b.h); gl.uniform2f(gl.getUniformLocation(pBlur, 'uD'), 0, 2 / H); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.deleteVertexArray(va);
    va = fsq(pTone, fb.main.t, null, W, H); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fb.b.t); gl.uniform1i(gl.getUniformLocation(pTone, 'uB'), 1); gl.uniform1f(gl.getUniformLocation(pTone, 'uBloom'), st.bloom ? 0.45 : 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.deleteVertexArray(va);
  }
  requestAnimationFrame(frame);
}
// 截图自检用：?N=N400&t=3.3&elev=20&azim=0&dist=1000&zoom=1
const q = new URLSearchParams(location.search);
if (q.get('N') && meshes[q.get('N')]) st.N = q.get('N');
for (const k of ['dist', 'elev', 'azim', 'zoom', 'bright']) if (q.get(k) != null) $(k).value = q.get(k);
if (q.get('t') != null) { st.t = +q.get('t'); $('time').value = st.t; }
if (q.get('ui') === '0') $('ui').style.display = 'none';
sync(); requestAnimationFrame(frame);
window.__ready = () => ready;
})();
</script>
</body>
</html>
