<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连续尾丝 · 实际贴图分层预览</title>
<style>:root{font:16px system-ui,"Microsoft YaHei",sans-serif;color-scheme:dark;background:#090d14;color:#e7edf5}*{box-sizing:border-box}body{max-width:1450px;margin:auto;padding:24px}a{color:#b3d6fb}h1{font-size:26px}p{color:#aebbd0;line-height:1.7}button,select{background:#172438;color:inherit;padding:9px 14px;border:1px solid #35455d;border-radius:6px;font:inherit;cursor:pointer}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}input{accent-color:#efbc75}#time{flex:1;min-width:140px}main{display:grid;grid-template-columns:minmax(0,900px) minmax(220px,1fr);gap:24px}canvas{width:100%;aspect-ratio:1;display:block;background:#03060c;border:1px solid #253145}#layers label{display:block;margin:18px 0;line-height:1.6}#status{color:#e8be80;min-height:28px}#clock{font-variant-numeric:tabular-nums;min-width:110px}button:disabled,select:disabled{opacity:.5;cursor:wait}small{color:#8799b1}@media(max-width:800px){main{grid-template-columns:1fr}body{padding:14px}}</style>
<a href="./">← 返回实拍 / 第二版 / 第三版同步对照</a><h1>第三版：检查实际烘焙素材</h1>
<p>关闭某个图层，查看白亮段、暖色细尾分别贡献了什么。这里直接解码 RGBA 贴图，没有视频压缩、锐化或补帧。</p>
<div class="tools"><label>效果 <select id="effect"><option value="V14">鸿巢四尺玉</option><option value="V13">片贝四尺玉</option></select></label><label>图集 <select id="quality"><option value="fine-4k">4K · 单帧 512 px</option><option value="fine-8k">8K · 单帧 1024 px</option><option value="fine-2k">2K · 单帧 256 px</option></select></label><button id="zoom">局部 4×</button><button id="center">回到全图</button><a id="download" download>下载素材</a></div>
<div id="status" role="status">正在读取贴图…</div><main><section><canvas id="render" width="1024" height="1024"></canvas><small>点击画面指定放大中心。放大用于检查已有像素，不增加素材分辨率。</small></section><aside><h2>图层</h2><div id="layers"></div><p id="facts"></p><p><a href="线条拆解.png">原片线条标注 ↗</a></p></aside></main>
<div class="tools"><button id="play">播放</button><input type="range" id="time" min="0" max="10.4" step=".001" value="3.2" aria-label="开花后时间"><span id="clock"></span><select id="speed" aria-label="播放速度"><option value="1">原速</option><option value=".5">半速</option><option value=".25">四分之一速度</option></select></div>
<script src="../player.js"></script><script>
const $=s=>document.getElementById(s),player=new AtlasPlayer($('render'));
let busy=false,t=3.2,z=1,focus=[.5,.5],playing=false,last=performance.now(),manifest,allLayers=[];
function redraw(){if(busy||!manifest)return;player.render(t,z,focus);$('time').value=t;$('clock').textContent=t.toFixed(2)+' / '+manifest.duration.toFixed(2)+' s';}
async function load(){if(busy)return;busy=true;playing=false;$('play').textContent='播放';['effect','quality','play','time','zoom'].forEach(k=>$(k).disabled=true);$('status').textContent='正在加载原生贴图…';
 try{manifest=await(await fetch($('effect').value+'-study.json')).json();const variant=manifest.variants[$('quality').value];player.resize(1024);await player.load(variant);allLayers=player.layers.slice();
  $('layers').replaceChildren(...allLayers.map((l,i)=>{const label=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.dataset.layer=i;cb.onchange=()=>{player.layers=allLayers.filter((l,j)=>$('layers').querySelectorAll('input')[j].checked);redraw()};label.append(cb,' '+l.name+' ');const a=document.createElement('a');a.href='../../tool/FireworkBaker.html?fast&study='+manifest.id+'&layer='+i;a.textContent='调参 ↗';label.append(a);return label}));
  $('time').max=manifest.duration-.001;t=manifest.id==='V14'?3.2:6.5;z=1;focus=[.5,.5];$('zoom').textContent='局部 4×';$('download').href=manifest.id+'-'+$('quality').value+'.zip';
  const n=variant.layers.reduce((a,l)=>a+l.segments.length,0);$('facts').textContent=`${variant.layers.length} 个图层，${n} 张贴图。每张 256 帧，单帧 ${variant.size/8} × ${variant.size/8}。A 通道也存帧数据。`; $('status').textContent='已加载。可关闭白亮段，单独检查暖色长尾。';
 }catch(e){$('status').textContent='加载失败：'+e.message;}finally{busy=false;['effect','quality','play','time','zoom'].forEach(k=>$(k).disabled=false);redraw();}}
$('effect').onchange=load;$('quality').onchange=load;$('time').oninput=()=>{playing=false;$('play').textContent='播放';t=+$('time').value;redraw()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};
$('zoom').onclick=()=>{z=z===1?4:1;$('zoom').textContent=z===4?'取消 4×':'局部 4×';redraw()};$('center').onclick=()=>{z=1;focus=[.5,.5];$('zoom').textContent='局部 4×';redraw()};
$('render').onclick=e=>{const r=$('render').getBoundingClientRect();focus=[focus[0]+((e.clientX-r.left)/r.width-.5)/z,focus[1]+(.5-(e.clientY-r.top)/r.height)/z];redraw()};
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing&&!busy){t=(t+dt*+$('speed').value)%manifest.duration;redraw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);load();
window.filamentPreview={player,get busy(){return busy},get t(){return t},seek(value){t=value;redraw()}};
</script></html>
