<video id="video" muted playsinline preload="auto"></video><script src="player.js"></script><script>
const $=id=>document.getElementById(id),players=[new AtlasPlayer($('original')),new AtlasPlayer($('enhanced'))];
const reference=$('reference').getContext('2d'),video=$('video');let manifests={},refs={},busy=false,playing=false,time=1,zoom=1,focus=[.5,.5],last=performance.now(),manifest,variant,videoURL;
const framing={JM:{t0:.867,crop:[1480,30,660,660]},V14:{t0:4.2,crop:[-40,-20,800,800]},V13:{t0:5.7,crop:[-90,0,900,900]}};
function redraw(){if(!manifest||busy)return;players[1].render(time,zoom,focus);if(manifest.id==='JM')players[0].render(time,zoom,focus);const [x,y,w,h]=framing[manifest.id].crop;const fx=focus[0],fy=1-focus[1];if(video.readyState>=2){reference.fillStyle='#03060a';reference.fillRect(0,0,1024,1024);reference.drawImage(video,x+w*(fx-.5/zoom),y+h*(fy-.5/zoom),w/zoom,h/zoom,0,0,1024,1024)}$('time').value=time;$('clock').textContent=`${time.toFixed(2)} / ${manifest.duration.toFixed(2)} s`;}
function seek(t){time=Math.max(0,Math.min(t,manifest.duration-.001));const vt=framing[manifest.id].t0+time;if(video.readyState>=1)video.currentTime=Math.min(vt,video.duration-.02);redraw();}
async function load(){if(busy)return;busy=true;playing=false;$('play').textContent='播放';video.pause();for(const id of ['effect','quality','play','restart','zoom','time'])$(id).disabled=true;$('status').textContent='正在加载实际贴图；8K 素材会需要更多显存…';
 try{manifest=manifests[$('effect').value];variant=manifest.variants[$('quality').value];if(!variant)throw Error('这一档素材尚未生成');players.forEach(p=>p.clear());$('oldPanel').hidden=manifest.id!=='JM';$('views').classList.toggle('two',manifest.id!=='JM');if(manifest.id==='JM')await players[0].load(manifest.variants['original-2k']);await players[1].load(variant);
  // Blob URLs remain seekable even with a simple local server without Range support.
  const vr=await fetch('../../../'+refs[manifest.id].path);if(!vr.ok)throw Error('参考视频无法读取');if(videoURL)URL.revokeObjectURL(videoURL);videoURL=URL.createObjectURL(await vr.blob());
  await new Promise((resolve,reject)=>{video.onloadeddata=resolve;video.onerror=()=>reject(Error('参考视频无法加载'));video.src=videoURL;});
  $('time').max=manifest.duration;$('newTitle').textContent='升级版 · '+variant.size/1024+'K';$('newInfo').textContent='单帧 '+variant.size/8+' px';$('sourceInfo').textContent=refs[manifest.id].width+' × '+refs[manifest.id].height;
  $('package').href=manifest.id+'-'+$('quality').value+'.zip';$('package').textContent='下载 '+manifest.id+' · '+variant.size/1024+'K 素材';
  const n=variant.layers.reduce((a,l)=>a+l.segments.length,0);$('facts').textContent=`${variant.layers.length} 个图层 / ${n} 张灰度 RGBA 贴图 / 每张 256 帧 / 总时长 ${manifest.duration} 秒\n${variant.size} × ${variant.size} 母版 → 单帧 ${variant.size/8} × ${variant.size/8}；4 倍空间超采样，最高 960 Hz 快门采样。\nPNG 的 A 通道也存帧数据，不能当透明度处理。预览按整数帧播放，不做帧间混合。`;
  $('note').textContent=manifest.id==='JM'?'同参数、同随机种子、同取景、同帧时刻、同曝光，双方均关闭附加辉光。实拍裁切仅供造型参考，未锐化。':manifest.id==='V14'?'鸿巢：白金色主花、下垂尾迹、末段红色闪点。按原始视频重新对齐开花点至 4.20 s。':'片贝：金色载体、彩色内芯、延时金色子花与花雨。开花点 5.70 s；彩芯与外圈子花已按视频分阶段校准。';
  $('layers').replaceChildren(...variant.layers.map((l,i)=>{const a=document.createElement('a');a.href='../tool/FireworkBaker.html?fast&study='+manifest.id+'&layer='+i;a.textContent='调整 '+l.name+' ↗';if(manifest.id==='JM'){a.href=l.parameters;a.textContent='金芒菊配方 JSON';}return a;}));
  $('status').textContent='已加载。拖动时间轴，或打开局部放大检查细丝与粒子。';busy=false;seek(manifest.id==='JM'?1.6:manifest.id==='V14'?3.25:6.5);
 }catch(e){$('status').textContent=e.message;busy=false;}finally{for(const id of ['effect','quality','play','restart','zoom','time'])$(id).disabled=false;}}
$('effect').onchange=load;$('quality').onchange=load;$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';if(playing){video.playbackRate=+$('speed').value;video.play().catch(()=>{});}else video.pause();};$('restart').onclick=()=>seek(0);$('speed').onchange=()=>video.playbackRate=+$('speed').value;$('time').oninput=e=>{playing=false;video.pause();$('play').textContent='播放';seek(+e.target.value)};$('zoom').onclick=()=>{zoom=zoom===1?4:1;$('zoom').setAttribute('aria-pressed',zoom===4);redraw()};
document.querySelectorAll('.picture canvas').forEach(c=>c.onclick=e=>{const r=c.getBoundingClientRect();focus=[(e.clientX-r.left)/r.width,1-(e.clientY-r.top)/r.height];redraw()});video.onseeked=redraw;
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing&&!busy){time+=dt*+$('speed').value;if(time>=Math.min(manifest.duration,video.duration-framing[manifest.id].t0)){seek(0);}else if(!video.seeking&&Math.abs(video.currentTime-framing[manifest.id].t0-time)>.14)video.currentTime=time+framing[manifest.id].t0;redraw();}requestAnimationFrame(tick)}requestAnimationFrame(tick);
Promise.all(['JM','V14','V13'].map(async id=>{const r=await fetch(id+'-study.json');if(!r.ok)throw Error('实验素材尚未完成：'+id);manifests[id]=await r.json()})).then(async()=>{refs=await(await fetch('references.json')).json();await load()}).catch(e=>$('status').textContent=e.message);
window.studyUI={players,seek,redraw,get time(){return time},get busy(){return busy}};
